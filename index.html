<style>
/* ---------------------------------------------------------------------------
   Somniq Home v2 — standalone preview.
   Pixel mirror of src/components/home-v2/* at 393x852. Same copy, same

--------------------------------------------------------------------------- */
:root{
  --ink:#FFFFFF;
  --muted:rgba(255,255,255,0.55);
  --faint:rgba(255,255,255,0.35);
  --hairline:rgba(255,255,255,0.09);
  --violet:#a78bfa;
  --cyan:#22d3ee;
  --green:#34d399;
  --amber:#fbbf24;
  --rose:#fb7185;
  --radius:24px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
html,body{height:100%;background:#050308;font-family:'Inter',-apple-system,system-ui,sans-serif;}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;}

#stage{position:relative;}
#frame{
  position:relative;width:393px;height:852px;overflow:hidden;background:#000;
  transform-origin:top left;
  box-shadow:0 30px 90px rgba(0,0,0,.8);
}
@media (min-width:460px){ #frame{border-radius:44px;} }

/* --- night sky ----------------------------------------------------------- */

.sky .g1{position:absolute;inset:0;background:linear-gradient(180deg,#241a4d 0%,#17123a 26%,#0a0818 60%,#000 100%);}

.star{position:absolute;border-radius:50%;background:#fff;}

.statusbar{position:relative;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:5;}

.notch{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:124px;height:34px;border-radius:18px;background:#000;}
.sbicons{display:flex;align-items:center;gap:6px;}

/* --- chrome -------------------------------------------------------------- */

/* =========================================================================

   ========================================================================= */
const TRACK_START_HOUR = 7, TRACK_END_HOUR = 23, SWEEP = 270, START_ANGLE = -135;
const LABEL_HOURS = [7, 12, 18, 23];
const DIAL = 272, RING_R = 101, ORB_R = 65, TICK_GAP = 5, LABEL_R = 121;
const C = DIAL / 2;

const TONE = { green:'#34d399', amber:'#fbbf24', rose:'#fb7185', violet:'#a78bfa', cyan:'#22d3ee' };

function angleForHour(h){
  const span = TRACK_END_HOUR - TRACK_START_HOUR;
  const v = Math.min(TRACK_END_HOUR, Math.max(TRACK_START_HOUR, h));
  return START_ANGLE + ((v - TRACK_START_HOUR) / span) * SWEEP;
}
function polar(r, deg){
  const rad = (deg - 90) * Math.PI / 180;
  return { x: C + r * Math.cos(rad), y: C + r * Math.sin(rad) };
}
function arc(r, from, to){
  const a = polar(r, from), b = polar(r, to);
  const large = (to - from) > 180 ? 1 : 0;
  return `M ${a.x.toFixed(2)} ${a.y.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${b.x.toFixed(2)} ${b.y.toFixed(2)}`;
}
function trackLabel(h){ const s = h >= 12 ? 'p' : 'a'; return (h % 12 || 12) + s; }

    aria:{
      line:'Your first estimate from what you told us. Tonight’s recording sharpens it.',
      full:'Your first estimate from what you told us. Tonight’s recording sharpens it. After three nights the number stops moving on its own and starts following what you actually sleep.',
    },
    lastNight:{ kind:'baseline', eyebrow:'TONIGHT · YOUR PHONE RECORDS', title:'Night 1 of 3',
                trailing:'starts tonight', step:1, total:3 },
    action:{ kind:'schedule', label:'Wind down at 10:30pm', why:'Why?' },
    week:{
      debt:[['W',null],['T',null],['F',null],['S',null],['S',null],['M',null],['T',1.2]],
      hours:[['W',null],['T',null],['F',null],['S',null],['S',null],['M',null],['T',null]],
    },
    debtSheet:{
      score:null, payoff:null,
      body:'Your first estimate comes from the schedule you gave us. Tonight’s recording replaces it with measured hours.',
      parts:[], footer:'Updated from your quiz · Schedule',
      estimate:'Provisional · sharpens nightly', coverage:'Building 0 of 14 nights',
    },
    nightSheet:{
      duration:'—', clocks:'', bed:'—', wake:'—',
      source:'Awaiting', confidence:null, nap:'Add', confirm:'Looks right',
      empty:'No observed night yet. Log your usual window — hours are never guessed.',
    },
  },
};

/* ========================================================================= */
const params = new URLSearchParams(location.search);
const stateKey = STATES[params.get('state')] ? params.get('state') : 'morning';
const S = STATES[stateKey];
const sheetKey = params.get('sheet');
const clean = params.get('clean') === '1';

function stars(){
  let out = '';
  for (let i = 0; i < 46; i++){
    const s = (n) => { const x = Math.sin((i + 1) * 12.9898 + n * 78.233) * 43758.5453; return x - Math.floor(x); };
    const size = (0.8 + s(3) * 1.6).toFixed(2);
    out += `<div class="star" style="left:${(s(1)*100).toFixed(2)}%;top:${(s(2)*72).toFixed(2)}%;
      width:${size}px;height:${size}px;opacity:${(0.12 + s(4)*0.4).toFixed(2)}"></div>`;
  }
  return out;
}

function dial(){
  const tone = TONE[S.hero.tone];
  const accent = TONE[S.pill.tone === 'cyan' ? 'amber' : S.pill.tone];
  const trackKnown = S.hero.trackKnown;
  const nowAngle = trackKnown ? angleForHour(S.nowHour) : null;
  const fromAngle = angleForHour(S.wakeHour == null ? TRACK_START_HOUR : S.wakeHour);

  let ticks = '', labels = '';
  for (let h = TRACK_START_HOUR; h <= TRACK_END_HOUR; h++){
    const labelled = LABEL_HOURS.includes(h);
    const a = angleForHour(h);
    const inner = polar(RING_R + TICK_GAP, a);
    const outer = polar(RING_R + TICK_GAP + (labelled ? 7 : 3), a);
    ticks += `<line x1="${inner.x.toFixed(2)}" y1="${inner.y.toFixed(2)}" x2="${outer.x.toFixed(2)}" y2="${outer.y.toFixed(2)}"
      stroke="${labelled ? 'rgba(255,255,255,.45)' : 'rgba(255,255,255,.14)'}" stroke-width="1" stroke-linecap="round"/>`;
    if (labelled){
      const p = polar(LABEL_R, a);
      labels += `<div class="hourlbl" style="left:${(p.x-16).toFixed(1)}px;top:${(p.y-7).toFixed(1)}px">${trackLabel(h)}</div>`;
    }
  }

  const progress = (trackKnown && nowAngle != null && nowAngle - fromAngle > 0.5)
    ? `<path d="${arc(RING_R, fromAngle, nowAngle)}" fill="none" stroke="url(#prog)" stroke-width="6"
         stroke-linecap="round" opacity=".5" filter="url(#soft)"/>
       <path d="${arc(RING_R, fromAngle, nowAngle)}" fill="none" stroke="url(#prog)" stroke-width="3.2" stroke-linecap="round"/>`
    : '';

  const dot = nowAngle == null ? '' : (() => {
    const p = polar(RING_R, nowAngle);
    return `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="13" fill="${accent}" opacity=".4" filter="url(#soft)"/>
            <circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="7" fill="${accent}"/>
            <circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="2.6" fill="rgba(255,255,255,.9)"/>`;
  })();

  return `
  <div class="dial">
    <div class="halo" style="background:radial-gradient(circle,${tone}55 0%,${tone}00 70%)"></div>
    <svg viewBox="0 0 ${DIAL} ${DIAL}" width="${DIAL}" height="${DIAL}">
      <defs>
        <linearGradient id="prog" gradientUnits="userSpaceOnUse"
          x1="${polar(RING_R, fromAngle).x}" y1="${polar(RING_R, fromAngle).y}"
          x2="${polar(RING_R, nowAngle == null ? fromAngle : nowAngle).x}"
          y2="${polar(RING_R, nowAngle == null ? fromAngle : nowAngle).y}">
          <stop offset="0%" stop-color="${TONE.violet}"/>
          <stop offset="45%" stop-color="${TONE.violet}"/>
          <stop offset="100%" stop-color="${accent}"/>
        </linearGradient>
        <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
        <filter id="soft2" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="14"/>
        </filter>
        <filter id="spec" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="1.5"/>
        </filter>
        <filter id="spec2" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="5"/>
        </filter>
        <radialGradient id="body" cx="35%" cy="29%" r="92%">
          <stop offset="0%" stop-color="#2b2446"/>
          <stop offset="42%" stop-color="#171331"/>
          <stop offset="78%" stop-color="#0b0918"/>
          <stop offset="100%" stop-color="#05040c"/>
        </radialGradient>
        <clipPath id="orbclip"><circle cx="${C}" cy="${C}" r="${ORB_R}"/></clipPath>
      </defs>

      <path d="${arc(RING_R, START_ANGLE, START_ANGLE + SWEEP)}" fill="none"
        stroke="${trackKnown ? 'rgba(255,255,255,.13)' : 'rgba(167,139,250,.5)'}"
        stroke-width="${trackKnown ? 1.5 : 2}" stroke-linecap="round"
        ${trackKnown ? '' : 'stroke-dasharray="1.6 6"'}/>
      ${ticks}
      ${progress}

      <circle cx="${C}" cy="${C}" r="${ORB_R}" fill="url(#body)"/>
      <g clip-path="url(#orbclip)">
        <circle cx="${C}" cy="${C + ORB_R*0.46}" r="${ORB_R*0.74}" fill="${tone}" opacity=".5" filter="url(#soft2)"/>
        <circle cx="${C}" cy="${C + ORB_R*0.52}" r="${ORB_R*0.34}" fill="${tone}" opacity=".55" filter="url(#soft)"/>
        <circle cx="${C - ORB_R*0.38}" cy="${C - ORB_R*0.66}" r="${ORB_R*0.17}" fill="rgba(255,255,255,.32)" filter="url(#spec2)"/>
        <circle cx="${C - ORB_R*0.4}" cy="${C - ORB_R*0.7}" r="${ORB_R*0.055}" fill="rgba(255,255,255,.7)" filter="url(#spec)"/>
      </g>
      <circle cx="${C}" cy="${C}" r="${ORB_R}" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="1"/>
      ${dot}
    </svg>
    ${labels}
    <div class="orbtext">
      <div class="eyebrow">SLEEP DEBT</div>
      <div class="numrow"><div class="pad"></div><div class="num">${S.hero.value}</div><div class="unit">${S.hero.unit}</div></div>
    </div>
  </div>`;
}

function pills(){
  const row = (tone, strong, rest) => `
    <div class="pill" style="border-color:${TONE[tone]}47">
      <div class="dot" style="background:${TONE[tone]};box-shadow:0 0 5px ${TONE[tone]}"></div>
      <div class="txt">${strong ? `<b>${strong}</b>` : ''}${strong && rest ? ' ' : ''}${rest || ''}</div>
    </div>`;
  return `<div class="pillblock">
    ${S.hero.estimateLabel ? row('violet', null, S.hero.estimateLabel) : ''}
    ${row(S.pill.tone, S.pill.strong, S.pill.rest)}
  </div>`;
}

function strip(){
  const ln = S.lastNight;
  if (ln.kind === 'baseline'){
    return `<div class="stripblock"><div class="glass cyan"><div class="in strip">
      <div class="left">
        <div class="eyecyan">${ln.eyebrow}</div>
        <div class="valrow"><div class="dur">${ln.title}</div><div class="clocks">${ln.trailing}</div></div>
      </div>
      <div class="segments">${[0,1,2].map(i => `<div class="seg${i < ln.step ? ' on' : ''}"></div>`).join('')}</div>
    </div></div></div>`;
  }
  return `<div class="stripblock"><div class="glass cyan"><div class="in strip">
    <div class="left">
      <div class="eyecyan">${ln.eyebrow}</div>
      <div class="valrow"><div class="dur">${ln.duration}</div><div class="clocks">${ln.clocks}</div></div>
    </div>
    <div class="confirm">${ln.confirmLabel}</div>
  </div></div></div>`;
}

function chip(){
  const a = S.action;
  if (a.kind === 'checkin'){
    return `<div class="chipblock"><div class="glass"><div class="in chiprow">
      <div class="question">${a.question}</div>
      <div class="held">${a.held}</div>
      <div class="notyet">${a.notYet}</div>
    </div></div></div>`;
  }
  return `<div class="chipblock"><div class="glass"><div class="in chiprow">
    <div class="chip">${a.label}</div><div class="spacer"></div><div class="why">${a.why}</div>
  </div></div></div>`;
}

let weekTab = 'debt';
function barColor(h){ if (h <= 2) return TONE.green; if (h <= 3.5) return TONE.amber; return TONE.rose; }

function weekCard(){
  const rows = weekTab === 'debt' ? S.week.debt : S.week.hours;
  const vals = rows.map(r => r[1]).filter(v => v != null);
  const peak = vals.length ? Math.max(...vals) : 1;
  const bars = rows.map(([d, h]) => {
    if (h == null){
      return `<div class="barcol"><div class="barval">—</div>
        <div class="bar" style="height:10px;background:rgba(255,255,255,.18)"></div>
        <div class="barday">${d}</div></div>`;
    }
    const px = Math.min(56, Math.max(8, (h / peak) * 56));
    const c = weekTab === 'debt' ? barColor(h) : TONE.cyan;
    return `<div class="barcol"><div class="barval">${h.toFixed(1)}</div>
      <div class="bar" style="height:${px.toFixed(1)}px;background:${c};box-shadow:0 0 10px ${c}66"></div>
      <div class="barday">${d}</div></div>`;
  }).join('');

  return `<div class="weekblock"><div class="glass"><div class="in week">
    <div class="weekhead">
      <div class="eyegrey">THIS WEEK</div>
      <div class="segmented">
        <div class="segbtn${weekTab === 'debt' ? ' on' : ''}" data-tab="debt">Debt</div>
        <div class="segbtn${weekTab === 'hours' ? ' on' : ''}" data-tab="hours">Hours asleep</div>
      </div>
    </div>
    <div class="bars">${bars}</div>
    <div class="rule"></div>
    <div class="recaphead" id="recaphead">
      <div class="recaptitle">Aria’s recap</div>
      <div style="color:rgba(255,255,255,.35);font-size:13px">▾</div>
    </div>
    <div class="recap">${S.aria.full}</div>
  </div></div></div>`;
}

function debtSheet(){
  const d = S.debtSheet;
  return `<div class="sheet${sheetKey === 'debt' ? ' show' : ''}" id="sheet-debt">
    <div class="grabber"></div>
    <div class="sheethead"><div class="sheeteye">Sleep debt</div><div class="done">Done</div></div>
    <div class="sheetbody">
      <div class="toprow">
        <div class="bignum"><div class="n">${S.hero.value}</div><div class="u">${S.hero.unit}</div></div>
        ${d.score ? `<div class="scorewrap"><div class="scoreeye">SCORE</div><div class="score">${d.score}</div></div>` : ''}
      </div>
      ${d.estimate ? `<div class="estimate">${d.estimate}</div>` : ''}
      ${d.coverage ? `<div class="foottxt" style="margin-top:4px">${d.coverage}</div>` : ''}
      ${d.payoff ? `<div class="payoff">${d.payoff}</div>` : ''}
      <div class="sheetbodytxt">${d.body}</div>
      ${d.parts.length ? `<div class="glass parts"><div class="in">
        <div class="partstitle">WHAT MAKES THE SCORE</div>
        ${d.parts.map(([l, pct, pts, c]) => `<div class="partrow">
          <div class="partlbl">${l}</div>
          <div class="track"><div class="fill" style="width:${(pct*100).toFixed(0)}%;background:${c};box-shadow:0 0 6px ${c}99"></div></div>
          <div class="partpts">${pts}</div></div>`).join('')}
      </div></div>` : ''}
      <div class="sheetrule"></div>
      <div class="linkrow"><div class="linktxt">How we estimate debt</div>
        <div style="color:rgba(255,255,255,.35)">›</div></div>
      <div class="sheetrule" style="margin-top:0"></div>
      <div style="height:120px"></div>
    </div>
    <div class="sheetfoot"><div class="foottxt">${d.footer}</div><div class="refresh">Refresh</div></div>
  </div>`;
}

function nightSheet(){
  const n = S.nightSheet;
  return `<div class="sheet${sheetKey === 'night' ? ' show' : ''}" id="sheet-night">
    <div class="grabber"></div>
    <div class="sheethead"><div class="sheeteye cyan">Last night</div><div class="done">Done</div></div>
    <div class="sheetbody">
      <div class="nightdur">${n.duration}</div>
      ${n.clocks ? `<div class="nightclocks">${n.clocks}</div>` : ''}
      ${n.empty ? `<div class="sheetbodytxt">${n.empty}</div>` : ''}
      <div class="sourcerow">
        <div class="sourcepill">${n.source}</div>
        ${n.confidence ? `<div class="confidence">${n.confidence}</div>` : ''}
      </div>
      <div class="glass editcard"><div class="in">
        <div class="editrow"><div class="l"><div class="rowlbl">Fell asleep</div><div class="rowval">${n.bed}</div></div>
          <div class="nudge">−30m</div><div class="nudge">+30m</div></div>
        <div class="editrule"></div>
        <div class="editrow"><div class="l"><div class="rowlbl">Woke up</div><div class="rowval">${n.wake}</div></div>
          <div class="nudge">−30m</div><div class="nudge">+30m</div></div>
        <div class="editrule"></div>
        <div class="plainrow"><div class="rowlbl">Naps</div><div class="action">${n.nap}</div></div>
        <div class="editrule"></div>
        <div class="plainrow"><div class="rowlbl">Split night</div><div class="switch"><i></i></div></div>
      </div></div>
      <div style="height:90px"></div>
    </div>
    <div class="primarybtn">${n.confirm}</div>
  </div>`;
}

function render(){
  document.getElementById('frame').innerHTML = `
    <div class="sky"><div class="g1"></div><div class="g2"></div>${stars()}</div>
    <div class="screen">
      <div class="statusbar">
        <div class="time">${S.clock}</div>
        <div class="notch"></div>
        <div class="sbicons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".4"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="rgba(255,255,255,.5)"/><rect x="2" y="2" width="18" height="8" rx="2" fill="#fff"/><rect x="23" y="4" width="1.5" height="4" rx=".7" fill="rgba(255,255,255,.5)"/></svg>
        </div>
      </div>
      <div class="topchrome"><div class="header">
        <div class="htitle">
          <div class="greeting">${S.header.greeting}, ${S.header.name}</div>
          <div class="hdate">${S.header.date}</div>
        </div>
        <div class="avatar"><i>${S.header.letter}</i></div>
      </div></div>
      <div class="scroll" id="scroll">
        <div class="heroblock">${dial()}</div>
        ${pills()}
        <div class="ariablock">
          <div class="ariaeye">ARIA</div>
          <div class="arialine">${S.aria.line}</div>
        </div>
        ${strip()}
        ${chip()}
        ${weekCard()}
        <div style="height:80px"></div>
      </div>
      <div class="dock">
        <div class="askbar"><div class="askorb"></div><div class="asktxt">Ask Aria</div></div>
        <div class="homebar"><i></i></div>
      </div>
    </div>
    <div class="backdrop${sheetKey ? ' show' : ''}"></div>
    ${debtSheet()}
    ${nightSheet()}
  `;

  document.querySelectorAll('.segbtn').forEach((el) => {
    el.addEventListener('click', () => { weekTab = el.dataset.tab; render(); });
  });
  const orb = document.querySelector('.orbtext');
  if (orb) orb.addEventListener('click', () => go({ sheet:'debt' }));
  const st = document.querySelector('.strip');
  if (st) st.addEventListener('click', () => go({ sheet:'night' }));
  document.querySelectorAll('.done, .backdrop').forEach((el) => {
    el.addEventListener('click', () => go({ sheet:null }));
  });
}

function go(patch){
  const p = new URLSearchParams(location.search);
  Object.entries(patch).forEach(([k, v]) => { if (v == null) p.delete(k); else p.set(k, v); });
  location.search = p.toString();
}

function switcher(){
  const el = document.getElementById('switcher');
  if (clean){ el.classList.add('hide'); return; }
  const link = (label, qs, on) => `<a class="${on ? 'on' : ''}" href="?${qs}">${label}</a>`;
  el.innerHTML = [
    link('Morning', 'state=morning', stateKey === 'morning' && !sheetKey),
    link('High debt', 'state=high-debt', stateKey === 'high-debt' && !sheetKey),
    link('First day', 'state=day1', stateKey === 'day1' && !sheetKey),
    link('Debt sheet', `state=${stateKey}&sheet=debt`, sheetKey === 'debt'),
    link('Night sheet', `state=${stateKey}&sheet=night`, sheetKey === 'night'),
    link('Clean', `state=${stateKey}${sheetKey ? `&sheet=${sheetKey}` : ''}&clean=1`, false),
  ].join('');
}

function fit(){
  const frame = document.getElementById('frame');
  const stage = document.getElementById('stage');
  // On a phone the frame fills the screen and the switcher floats over it;
  // on desktop it gets its own strip under the frame.
  const padBottom = (clean || window.innerWidth < 520) ? 0 : 56;
  const s = Math.min(window.innerWidth / 393, (window.innerHeight - padBottom) / 852, 1);
  frame.style.transform = `scale(${s})`;
  stage.style.width = `${393 * s}px`;
  stage.style.height = `${852 * s}px`;
  stage.style.marginBottom = `${padBottom}px`;
}

render();
switcher();
fit();
window.addEventListener('resize', fit);
</script>
</body>
</html>

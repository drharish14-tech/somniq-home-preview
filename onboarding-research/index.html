<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Somniq · Onboarding research moments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   Somniq · onboarding "research moments" — five screens, one phone-width page.

     ?m=1   Small losses add up          Van Dongen 2003
     ?m=2   Your need is personal        Watson 2015 · Kitamura 2016
     ?m=3   Repaying takes days          Kitamura 2016 · Belenky 2003
     ?m=4   Lie-ins aren't a full fix    Depner 2019
     ?m=5   What Somniq does for you     + trust footer

   Extends the shipped onboarding chrome, not a redesign:
   src/components/onboarding/StagedEntrance.tsx  — back chevron + progress
                                                   track, 28px title, 15px
                                                   helper, glass CTA pill,
                                                   uppercase eyebrow, skip
   src/components/onboarding/WeekChart.tsx       — hero number over bars
   src/components/onboarding/PayoffRing.tsx      — drawn ring / gauge
   src/components/onboarding/DebtTrendDraw.tsx   — progressively drawn trend
   src/constants/theme.ts                        — Inter + JetBrains Mono,
                                                   pure black, glass fills,
                                                   violet / teal / amber / coral

   Motion follows STAGED_ENTRANCE_BEATS (onboarding-motion.ts):
   title 0ms · visual 220ms · draw 800ms · button 1680ms · number 2100ms.
   Every moment is settled by ~2.4s, so ?m=N shows its final state.

   Every number on these screens is from the cited study or an illustration of
   it. None of it is user data — each visual says so.
--------------------------------------------------------------------------- */
:root{
  --ink:#FFFFFF;
  --muted:rgba(255,255,255,0.62);
  --soft:rgba(255,255,255,0.74);
  --faint:rgba(255,255,255,0.56);
  --hairline:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.12);
  --teal:#2dd4bf;
  --teal-lit:#5eead4;
  --emerald:#34d399;
  --amber:#fbbf24;
  --amber-lit:#fde68a;
  --orange:#fb923c;
  --coral:#fb7185;
  --coral-lit:#fda4af;
  --violet:#a78bfa;
  --violet-lit:#c4b5fd;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
html,body{background:#000;}
body{min-height:100%;color:var(--ink);font-family:'Inter',-apple-system,system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;}

/* --- backdrop: pure black, coloured depth only ------------------------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 56% at 50% -8%,rgba(126,84,236,.30),rgba(0,0,0,0) 62%),
    radial-gradient(90% 44% at 112% 34%,rgba(45,212,191,.16),rgba(0,0,0,0) 64%),
    radial-gradient(96% 48% at -12% 76%,rgba(251,113,133,.15),rgba(0,0,0,0) 64%),
    #000;}
.sky i{position:absolute;display:block;border-radius:50%;filter:blur(66px);}
.sky .b1{width:340px;height:340px;left:-130px;top:-130px;
  background:radial-gradient(circle,rgba(139,92,246,.50),rgba(139,92,246,0) 70%);}
.sky .b2{width:300px;height:300px;right:-140px;top:300px;
  background:radial-gradient(circle,rgba(45,212,191,.26),rgba(45,212,191,0) 70%);}
.sky .b3{width:320px;height:320px;left:-140px;top:720px;
  background:radial-gradient(circle,rgba(251,113,133,.22),rgba(251,113,133,0) 70%);}

/* --- phone --------------------------------------------------------------- */
.phone{position:relative;z-index:1;width:100%;max-width:390px;margin:0 auto;
  padding:10px 0 34px;min-height:100vh;display:flex;flex-direction:column;}

.chrome{display:flex;align-items:center;gap:12px;padding:6px 18px 8px;}
.back{width:32px;height:32px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--ink);
  font-size:17px;line-height:1;cursor:pointer;padding:0 2px 2px 0;position:relative;}
.back::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;}
.back:disabled{opacity:0;pointer-events:none;}
.segs{flex:1;display:flex;gap:6px;min-width:0;}
.segs i{flex:1;height:3px;border-radius:2px;display:block;background:rgba(255,255,255,.08);
  transition:background .3s ease;}
.segs i.done{background:var(--emerald);}
.segs i.on{background:linear-gradient(90deg,var(--teal-lit),var(--violet));
  box-shadow:0 0 12px rgba(167,139,250,.6);}
.chrome .spacer{width:32px;flex:none;}

.slide{flex:1;display:flex;flex-direction:column;padding:0 24px;touch-action:pan-y;}
h1{font-size:28px;line-height:34px;letter-spacing:-.6px;font-weight:700;}
.m-line{font-size:15px;line-height:21.5px;color:var(--soft);margin-top:10px;}
.m-note{font-size:12.5px;line-height:17.5px;color:var(--faint);margin-top:8px;}
.stage{padding:18px 0 4px;}

/* staged entrance — title 0ms, visual 220ms, footer 1680ms */
.ent{opacity:0;animation:rise .42s cubic-bezier(.22,.8,.3,1) forwards;}
.ent.d1{animation-delay:.22s;}
.ent.d2{animation-delay:1.68s;}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;}
@keyframes pop{from{transform:scale(.84);}to{transform:scale(1);}}

/* --- glass --------------------------------------------------------------- */
.card{--c:255,255,255;position:relative;border-radius:22px;border:1px solid var(--border);
  background:rgba(14,13,20,.5);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  overflow:hidden;padding:16px;
  box-shadow:0 18px 38px rgba(0,0,0,.6),0 0 46px -28px rgba(var(--c),.9),
             0 1px 0 rgba(255,255,255,.07) inset;}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 86% at 50% -6%,rgba(var(--c),.16),rgba(var(--c),0) 62%),
             linear-gradient(142deg,rgba(255,255,255,.075),rgba(255,255,255,.01) 48%);}
.card::after{content:'';position:absolute;top:0;left:16px;right:16px;height:1px;pointer-events:none;
  background:linear-gradient(90deg,rgba(var(--c),0),rgba(var(--c),.7),rgba(var(--c),0));}
.card>*{position:relative;z-index:1;}
.card.teal{--c:45,212,191;border-color:rgba(45,212,191,.26);}
.card.violet{--c:167,139,250;border-color:rgba(167,139,250,.26);}
.card.coral{--c:251,113,133;border-color:rgba(251,113,133,.24);}
.card.amber{--c:251,146,60;border-color:rgba(251,146,60,.24);}
.card+.card{margin-top:12px;}
.card.lit{border-color:rgba(45,212,191,.55);
  box-shadow:0 18px 38px rgba(0,0,0,.6),0 0 60px -20px rgba(45,212,191,1),
             0 1px 0 rgba(255,255,255,.12) inset;}

.eye{font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);}
.eye.teal{color:var(--teal-lit);text-shadow:0 0 18px rgba(45,212,191,.55);}
.eye.amber{color:var(--amber-lit);text-shadow:0 0 18px rgba(251,191,36,.5);}
.eye.coral{color:var(--coral-lit);text-shadow:0 0 18px rgba(251,113,133,.55);}
.eye.violet{color:var(--violet-lit);text-shadow:0 0 18px rgba(167,139,250,.55);}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}

.illus{display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  font-size:11px;line-height:15px;letter-spacing:.2px;color:rgba(255,255,255,.58);}
.illus b{width:5px;height:5px;border-radius:50%;flex:none;background:var(--violet);
  box-shadow:0 0 9px var(--violet);}
.cap{font-size:12px;line-height:17.5px;color:var(--muted);margin-top:10px;}

/* --- hero readout (WeekChart hero) -------------------------------------- */
.hero{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px;}
.hero .big{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:42px;line-height:42px;
  letter-spacing:-2px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.hero .big.coralgrad{background:linear-gradient(100deg,#fda4af,#fb7185 46%,#fb923c);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(251,113,133,.45));}
.hero .big.tealgrad{background:linear-gradient(100deg,#5eead4,#2dd4bf 48%,#a78bfa);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(45,212,191,.45));}
.hero .sub{font-size:12.5px;line-height:17px;color:var(--muted);padding-bottom:5px;min-width:0;}

svg{display:block;width:100%;overflow:visible;}
.card>svg{margin-top:10px;}
.axis{display:flex;justify-content:space-between;gap:8px;margin-top:8px;}
.axis span{font-size:11px;color:var(--faint);letter-spacing:.4px;}
.axis span.mid{color:rgba(255,255,255,.55);text-align:center;}

/* --- M1: focus comparison + feel meter ---------------------------------- */
.cmp{margin-top:4px;}
.cmprow{display:flex;align-items:center;gap:10px;padding:7px 0;}
.cmprow .k{font-size:11.5px;line-height:15px;color:var(--soft);width:106px;flex:none;}
.cmprow .bar{flex:1;height:10px;border-radius:999px;min-width:0;
  background:rgba(255,255,255,.06);box-shadow:inset 0 1px 2px rgba(0,0,0,.6);overflow:hidden;}
.cmprow .bar i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,rgba(251,113,133,.55),#fb7185 70%,#fb923c);
  box-shadow:0 0 16px -2px rgba(251,113,133,.9);}
.cmprow.alt .bar i{background:linear-gradient(90deg,rgba(167,139,250,.5),#c4b5fd 70%,#a78bfa);
  box-shadow:0 0 16px -2px rgba(167,139,250,.9);}
.same{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--coral-lit);}
.same i{flex:1;height:1px;display:block;
  background:linear-gradient(90deg,rgba(251,113,133,0),rgba(251,113,133,.5),rgba(251,113,133,0));}

.feel{margin-top:16px;padding-top:14px;border-top:1px solid var(--hairline);}
.feelhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.feelhead .v{font-size:11.5px;color:var(--teal-lit);font-weight:600;white-space:nowrap;}
.ftrack{position:relative;height:8px;border-radius:999px;margin-top:11px;
  background:linear-gradient(90deg,rgba(45,212,191,.42),rgba(251,191,36,.3) 52%,rgba(251,113,133,.42));
  box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
.fknob{position:absolute;top:50%;left:0;width:18px;height:18px;border-radius:50%;
  transform:translate(-50%,-50%);background:#fff;border:4px solid #0b0a12;
  box-shadow:0 0 0 1px rgba(255,255,255,.5),0 0 20px rgba(255,255,255,.45);}
.fends{display:flex;justify-content:space-between;margin-top:7px;}
.fends span{font-size:11px;color:var(--faint);}

/* --- M2: need dial ------------------------------------------------------- */
.dial{position:relative;}
.dialcore{position:absolute;left:0;right:0;top:46%;text-align:center;pointer-events:none;}
.dialcore .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:34px;line-height:34px;
  letter-spacing:-1.4px;font-variant-numeric:tabular-nums;
  background:linear-gradient(100deg,#5eead4,#a78bfa);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 20px rgba(94,234,212,.4));}
.dialcore .k{font-size:11px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--violet-lit);margin-top:8px;opacity:0;}
.dialcore .k.on{opacity:1;}
.dialcore .d{font-size:11.5px;color:var(--muted);margin-top:5px;}
.dialband{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:2px;
  font-size:11.5px;color:var(--teal-lit);}
.dialband i{width:16px;height:4px;border-radius:2px;display:block;background:rgba(45,212,191,.5);
  box-shadow:0 0 12px rgba(45,212,191,.8);}

/* --- M3: repay ----------------------------------------------------------- */
.nights{display:flex;gap:7px;margin-top:14px;}
.night{flex:1;min-width:0;border-radius:13px;padding:9px 6px;text-align:center;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);
  transition:border-color .3s,background .3s,box-shadow .3s,transform .3s;}
.night .n{font-size:11px;letter-spacing:.6px;color:var(--faint);text-transform:uppercase;}
.night .v{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;margin-top:4px;
  color:rgba(255,255,255,.72);}
.night.on{border-color:rgba(45,212,191,.5);
  background:linear-gradient(160deg,rgba(45,212,191,.26),rgba(45,212,191,.05));
  box-shadow:0 12px 26px -14px rgba(45,212,191,1),0 1px 0 rgba(255,255,255,.12) inset;}
.night.on .n{color:rgba(255,255,255,.78);}
.night.on .v{color:var(--teal-lit);text-shadow:0 0 14px rgba(45,212,191,.7);}
.trackline{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11.5px;color:var(--muted);}
.trackline b{width:6px;height:6px;border-radius:50%;flex:none;background:var(--teal-lit);
  box-shadow:0 0 10px var(--teal-lit);}

/* --- M4: week strips + tanks -------------------------------------------- */
.tank{margin-top:12px;}
.tankhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.tankhead .v{font-size:11.5px;font-weight:600;white-space:nowrap;}
.tanktrack{height:12px;border-radius:999px;margin-top:9px;overflow:hidden;
  background:rgba(255,255,255,.055);box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
.tanktrack i{display:block;height:100%;width:0;border-radius:999px;}
.tanktrack.part i{background:linear-gradient(90deg,#fb7185,#fb923c);
  box-shadow:0 0 18px -2px rgba(251,146,60,.9);}
.tanktrack.full i{background:linear-gradient(90deg,#5eead4,#34d399 60%,#2dd4bf);
  box-shadow:0 0 20px -2px rgba(52,211,153,.95);}

/* --- M5: reveal + trust -------------------------------------------------- */
.reveal{font-size:21px;line-height:30px;font-weight:600;letter-spacing:-.3px;}
.reveal .w{opacity:0;transition:opacity .5s ease;}
.reveal .w.on{opacity:1;}
.reveal .lead{color:rgba(255,255,255,.95);}
.reveal .a{color:var(--teal-lit);text-shadow:0 0 22px rgba(45,212,191,.45);}
.reveal .b{color:var(--violet-lit);text-shadow:0 0 22px rgba(167,139,250,.45);}
.reveal .c{color:var(--coral-lit);text-shadow:0 0 22px rgba(251,113,133,.45);}
.reveal .dot{color:rgba(255,255,255,.3);}
.doesrows{margin-top:16px;}
.doesrow{display:flex;gap:13px;padding:11px 0;border-top:1px solid var(--hairline);opacity:0;
  transition:opacity .45s ease;}
.doesrow:first-child{border-top:0;}
.doesrow.on{opacity:1;}
.doesrow .k{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;width:26px;flex:none;
  margin-top:2px;}
.doesrow:nth-child(1) .k{color:var(--teal-lit);}
.doesrow:nth-child(2) .k{color:var(--violet-lit);}
.doesrow:nth-child(3) .k{color:var(--coral-lit);}
.doesrow .t{font-size:14px;font-weight:600;}
.doesrow .d{font-size:12px;line-height:17px;color:var(--muted);margin-top:3px;}
.trust{font-size:12px;line-height:18px;color:rgba(255,255,255,.58);}
.trust b{color:rgba(255,255,255,.8);font-weight:600;}

/* --- source chips -------------------------------------------------------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
.chip{position:relative;display:inline-flex;align-items:center;gap:7px;
  min-height:44px;padding:0 13px;border-radius:14px;text-decoration:none;
  font-size:11.5px;font-weight:500;letter-spacing:.1px;color:rgba(255,255,255,.8);
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset;}
.chip::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:max(100%,44px);height:max(100%,44px);}
.chip .dt{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.62);}
.chip .ar{font-size:11px;color:rgba(255,255,255,.62);}
.chip.teal{border-color:rgba(45,212,191,.3);background:linear-gradient(150deg,rgba(45,212,191,.18),rgba(45,212,191,.04));}
.chip.violet{border-color:rgba(167,139,250,.32);background:linear-gradient(150deg,rgba(167,139,250,.18),rgba(167,139,250,.04));}
.chip.coral{border-color:rgba(251,113,133,.3);background:linear-gradient(150deg,rgba(251,113,133,.18),rgba(251,113,133,.04));}
.chip.amber{border-color:rgba(251,146,60,.3);background:linear-gradient(150deg,rgba(251,146,60,.16),rgba(251,146,60,.04));}
.chip:focus-visible{outline:2px solid rgba(167,139,250,.8);outline-offset:2px;}
.sourcenote{font-size:11px;line-height:16px;color:var(--faint);margin-top:10px;}

/* --- footer -------------------------------------------------------------- */
.footer{padding:14px 0 0;text-align:center;}
.cta{width:100%;min-height:52px;border-radius:28px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Inter',sans-serif;font-size:17px;font-weight:600;color:var(--ink);
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
  box-shadow:0 1px 0 rgba(255,255,255,.1) inset;
  transition:background .18s,border-color .18s,transform .14s;}
.cta:active{transform:scale(.985);background:rgba(255,255,255,.12);}
.cta.go{background:linear-gradient(100deg,rgba(94,234,212,.22),rgba(167,139,250,.26));
  border-color:rgba(167,139,250,.5);
  box-shadow:0 16px 34px -18px rgba(167,139,250,1),0 1px 0 rgba(255,255,255,.16) inset;}
.eyebrow{margin-top:14px;font-size:11px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;
  color:rgba(255,255,255,.6);}
.skip{display:inline-block;margin-top:9px;padding:9px 12px;min-height:44px;
  background:none;border:0;cursor:pointer;font-family:'Inter',sans-serif;
  font-size:13px;color:rgba(255,255,255,.58);}
.hint{margin-top:4px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
  color:rgba(196,181,253,.66);}
.cta:focus-visible,.back:focus-visible,.skip:focus-visible{outline:2px solid rgba(167,139,250,.8);outline-offset:3px;}

@media(max-width:375px){
  .phone{max-width:375px;}
  .slide{padding:0 18px;}
  h1{font-size:26px;line-height:32px;}
  .hero .big{font-size:38px;}
  .cmprow .k{width:92px;}
  .night{padding:8px 4px;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;
    transition-duration:.001s!important;}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<div class="phone">
  <div class="chrome">
    <button class="back" id="back" aria-label="Previous moment">&#8249;</button>
    <div class="segs" id="segs" role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1"
         aria-label="Research moment"></div>
    <span class="spacer"></span>
  </div>
  <div class="slide" id="slide"></div>
</div>

<script>
/* ═══════════════════════════ shared helpers ═══════════════════════════ */
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
/** eased 0..1 slice of the timeline */
const seg = (t, start, dur) => { const x = clamp((t - start) / dur, 0, 1); return 1 - Math.pow(1 - x, 3); };
const lin = (t, start, dur) => clamp((t - start) / dur, 0, 1);
/** overshoot, so the dial sweeps past its answer before it settles */
const back = (x) => { const c = 1.9, c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const el = (sel, root) => (root || document).querySelector(sel);
const els = (sel, root) => [...(root || document).querySelectorAll(sel)];

/** 485 → "8 h 05 m" */
function hm(mins) {
  const m = Math.max(0, Math.round(mins));
  const h = Math.floor(m / 60), r = m % 60;
  if (h === 0) return r + ' m';
  return h + ' h ' + String(r).padStart(2, '0') + ' m';
}
function pol(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
function arcPath(cx, cy, r, from, to) {
  const [x1, y1] = pol(cx, cy, r, from), [x2, y2] = pol(cx, cy, r, to);
  const large = Math.abs(to - from) > 180 ? 1 : 0;
  return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}

/* ═══════════════════════════ the sources ══════════════════════════════ */
const SRC = {
  vanDongen: { a: 'Van Dongen et al.', y: '2003', j: 'Sleep',       doi: 'https://doi.org/10.1093/sleep/26.2.117',          tone: 'coral'  },
  watson:    { a: 'Watson et al.',     y: '2015', j: 'Sleep',       doi: 'https://doi.org/10.5665/sleep.4716',              tone: 'teal'   },
  kitamura:  { a: 'Kitamura et al.',   y: '2016', j: 'Sci Rep',     doi: 'https://doi.org/10.1038/srep35812',               tone: 'violet' },
  belenky:   { a: 'Belenky et al.',    y: '2003', j: 'J Sleep Res', doi: 'https://doi.org/10.1046/j.1365-2869.2003.00337.x', tone: 'amber'  },
  depner:    { a: 'Depner et al.',     y: '2019', j: 'Curr Biol',   doi: 'https://doi.org/10.1016/j.cub.2019.01.069',       tone: 'coral'  },
};
function chips(keys, note) {
  const body = keys.map((k) => {
    const s = SRC[k];
    return `<a class="chip ${s.tone}" href="${s.doi}" target="_blank" rel="noopener noreferrer"
      aria-label="Source: ${s.a} ${s.y}, ${s.j}. Opens the DOI page in a new tab.">
      <span>${s.a}, ${s.y}</span><span class="dt">· ${s.j}</span><span class="ar" aria-hidden="true">↗</span></a>`;
  }).join('');
  return `<div class="chips">${body}</div>` +
    (note ? `<p class="sourcenote">${note}</p>` : '');
}

/* ═══════════════════════════ moment 1 ════════════════════════════════ */
/* 14 nights of 6 h stack into a pile of lost sleep. The focus loss lands
   level with one to two sleepless nights, while the self-rating hardly moves. */
const M1 = {
  n: 1,
  title: 'Small losses add up',
  line: 'Losing a little sleep adds up. In a lab study, two weeks of 6-hour nights hurt focus as much as one to two nights with no sleep, and people barely noticed.',
  keys: ['vanDongen'],
  note: 'Lab study: 6 h in bed nightly for 14 days; attention tested with the psychomotor vigilance task (PVT). Self-rated sleepiness increased only slightly.',
  cta: 'Next',
  build(mount) {
    const N = 14, GAP = 4, W = (342 - (N - 1) * GAP) / N;
    const BASE = 146, NEED = 112, SLEPT = NEED * 6 / 8;   // 8 h need, 6 h asleep
    let bars = '';
    for (let i = 0; i < N; i += 1) {
      const x = (i * (W + GAP)).toFixed(2);
      const tone = i % 2 === 0 ? 'gTeal' : 'gViolet';
      bars += `<rect class="b-short" x="${x}" y="${BASE}" width="${W.toFixed(2)}" height="0" rx="4"
                 fill="rgba(251,113,133,.26)"></rect>
               <rect class="b-slept" x="${x}" y="${BASE}" width="${W.toFixed(2)}" height="0" rx="5"
                 fill="url(#${tone})"></rect>`;
    }
    mount.innerHTML = `
      <div class="hero">
        <div class="big coralgrad" id="m1-big">0 h</div>
        <div class="sub">illustrative sleep shortfall<br>across 14 nights</div>
      </div>
      <div class="card coral">
        <svg viewBox="0 0 342 168" role="img"
             aria-label="Fourteen illustrative nights of six hours' sleep, each about two hours under an eight-hour need, stacking about 28 hours of lost sleep.">
          <defs>
            <linearGradient id="gTeal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
            <linearGradient id="gViolet" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
          </defs>
          <g id="m1-need" opacity="0">
            <line x1="0" y1="${BASE - NEED}" x2="342" y2="${BASE - NEED}"
                  stroke="rgba(255,255,255,.26)" stroke-width="1" stroke-dasharray="4 6"></line>
            <text x="0" y="${BASE - NEED - 8}" fill="rgba(255,255,255,.6)" font-size="11"
                  font-family="JetBrains Mono, monospace">8 H NEED</text>
          </g>
          ${bars}
        </svg>
        <div class="axis"><span>Night 1</span><span class="mid">Illustrative: 6 h sleep · 2 h short</span><span>Night 14</span></div>
      </div>
      <div class="card violet">
        <div class="eye violet">Attention loss · PVT in the study</div>
        <div class="cmp">
          <div class="cmprow"><div class="k">14 nights<br>of 6 h</div><div class="bar"><i id="m1-c1"></i></div></div>
          <div class="cmprow alt"><div class="k">1–2 nights<br>with no sleep</div><div class="bar"><i id="m1-c2"></i></div></div>
        </div>
        <div class="same"><span id="m1-same" style="opacity:0">about the same</span><i></i></div>
        <div class="feel">
          <div class="feelhead"><span class="eye">Sleepiness · self-rated</span><span class="v" id="m1-feelv">slightly increased</span></div>
          <div class="ftrack"><i class="fknob" id="m1-knob" style="left:6%"></i></div>
          <div class="fends"><span>Feels fine</span><span>Feels wrecked</span></div>
        </div>
        <div class="illus"><b></b>Illustrative bars and rating, not study measurements or your data</div>
      </div>`;

    const big = el('#m1-big', mount), need = el('#m1-need', mount);
    const shorts = els('.b-short', mount), slept = els('.b-slept', mount);
    const c1 = el('#m1-c1', mount), c2 = el('#m1-c2', mount);
    const same = el('#m1-same', mount), knob = el('#m1-knob', mount);
    return (t) => {
      need.setAttribute('opacity', seg(t, 640, 420).toFixed(3));
      const p = seg(t, 800, 900);
      for (let i = 0; i < N; i += 1) {
        const r = clamp(p * (N + 4) - i * 1.05, 0, 1) ** 0.9;   // one night after another
        const full = NEED * r;
        const s = Math.min(full, SLEPT), sh = Math.max(0, full - SLEPT);
        slept[i].setAttribute('height', s.toFixed(2));
        slept[i].setAttribute('y', (BASE - s).toFixed(2));
        shorts[i].setAttribute('height', sh.toFixed(2));
        shorts[i].setAttribute('y', (BASE - SLEPT - sh).toFixed(2));
      }
      big.textContent = Math.round(28 * p) + ' h';
      if (p >= 1 && !big.dataset.popped) { big.dataset.popped = '1'; big.classList.add('pop'); }
      c1.style.width = (92 * seg(t, 1760, 520)).toFixed(1) + '%';
      c2.style.width = (100 * seg(t, 1900, 520)).toFixed(1) + '%';
      same.style.opacity = lin(t, 2260, 300).toFixed(2);
      knob.style.left = (6 + 9 * seg(t, 1900, 600)).toFixed(1) + '%';
    };
  },
  dur: 2600,
};

/* ═══════════════════════════ moment 2 ════════════════════════════════ */
/* A need dial sweeps the 5–10 h range, overshoots, and settles just past
   8 h — labelled as learned, never as a measurement. */
const M2 = {
  n: 2,
  title: 'Your need is personal',
  line: 'Most adults need 7 hours or more, but your exact need is personal. Somniq learns yours.',
  keys: ['watson', 'kitamura'],
  note: 'Guideline: adults aged 18–60 should regularly sleep 7 h or more. Kitamura estimated an average optimal duration of about 8.4 h in 15 young men. The dial is illustrative.',
  cta: 'Next',
  build(mount) {
    const CX = 171, CY = 156, R = 118, LO = 5, HI = 10, TARGET = 8 + 5 / 60;
    const fracOf = (h) => (h - LO) / (HI - LO);
    const degOf = (f) => -90 + f * 180;
    let ticks = '';
    for (let h = LO; h <= HI; h += 1) {
      const f = fracOf(h), d = degOf(f);
      const [lx, ly] = pol(CX, CY, R + 33, d);
      const [ix, iy] = pol(CX, CY, R - 11, d), [ox, oy] = pol(CX, CY, R + 11, d);
      const anchor = f < 0.08 ? 'start' : f > 0.92 ? 'end' : 'middle';
      ticks += `<line x1="${ix.toFixed(1)}" y1="${iy.toFixed(1)}" x2="${ox.toFixed(1)}" y2="${oy.toFixed(1)}"
                  stroke="rgba(255,255,255,.22)" stroke-width="1"></line>
                <text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${anchor}"
                  font-size="11" font-family="JetBrains Mono, monospace"
                  fill="rgba(255,255,255,.66)">${h}h</text>`;
    }
    mount.innerHTML = `
      <div class="card violet">
        <div class="eye violet">Sleep need · illustrative dial</div>
        <div class="dial" style="margin-top:8px">
          <svg viewBox="0 0 342 196" role="img"
               aria-label="A dial over a five to ten hour range. The guideline band covers seven hours and up; the needle settles just past eight hours on an illustrative learned need.">
            <defs>
              <linearGradient id="gSweep" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#5eead4"/><stop offset=".55" stop-color="#2dd4bf"/>
                <stop offset="1" stop-color="#a78bfa"/></linearGradient>
            </defs>
            <path d="${arcPath(CX, CY, R, -90, 90)}" stroke="rgba(255,255,255,.08)" stroke-width="12"
                  fill="none" stroke-linecap="round"></path>
            <path id="m2-band" d="${arcPath(CX, CY, R, degOf(fracOf(7)), 90)}" stroke="rgba(45,212,191,.3)"
                  stroke-width="12" fill="none" stroke-linecap="round" opacity="0"></path>
            <g id="m2-ticks" opacity="0">${ticks}</g>
            <path id="m2-sweep" d="" stroke="url(#gSweep)" stroke-width="12" fill="none"
                  stroke-linecap="round"></path>
            <g id="m2-knob" opacity="0">
              <circle r="11" fill="rgba(10,9,16,.9)" stroke="rgba(255,255,255,.85)" stroke-width="2"></circle>
              <circle r="4.5" fill="#fff"></circle>
            </g>
          </svg>
          <div class="dialcore">
            <div class="v" id="m2-v">5 h 00 m</div>
            <div class="k" id="m2-k">yours, learned</div>
            <div class="d" id="m2-d" style="opacity:0">from your own nights</div>
          </div>
        </div>
        <div class="dialband"><i></i><span>Guideline band · 7 h or more</span></div>
        <div class="illus"><b></b>Illustrative dial. Somniq learns your need from your nights, it does not measure it.</div>
      </div>
      <div class="card teal">
        <div class="eye teal">What that means here</div>
        <p class="cap">Two people with the same bedtime can carry different debt, because their need is
          different. Somniq starts from the 7 h or more guideline, then moves your number as your
          nights come in.</p>
      </div>`;

    const band = el('#m2-band', mount), tk = el('#m2-ticks', mount);
    const sweep = el('#m2-sweep', mount), knob = el('#m2-knob', mount);
    const v = el('#m2-v', mount), k = el('#m2-k', mount), d = el('#m2-d', mount);
    return (t) => {
      band.setAttribute('opacity', seg(t, 520, 420).toFixed(3));
      tk.setAttribute('opacity', seg(t, 620, 480).toFixed(3));
      const p = lin(t, 800, 1200);
      const f = p <= 0 ? 0 : fracOf(TARGET) * back(p);        // sweeps past, then settles
      const frac = clamp(f, 0, 1);
      sweep.setAttribute('d', frac < 0.004 ? '' : arcPath(CX, CY, R, -90, degOf(frac)));
      const [kx, ky] = pol(CX, CY, R, degOf(frac));
      knob.setAttribute('transform', `translate(${kx.toFixed(1)} ${ky.toFixed(1)})`);
      knob.setAttribute('opacity', seg(t, 820, 300).toFixed(3));
      v.textContent = hm((LO + frac * (HI - LO)) * 60);
      if (p >= 1) {
        k.classList.add('on');
        if (!v.dataset.popped) { v.dataset.popped = '1'; v.classList.add('pop'); }
      }
      d.style.opacity = lin(t, 2200, 340).toFixed(2);
    };
  },
  dur: 2600,
};

/* ═══════════════════════════ moment 3 ════════════════════════════════ */
/* One hour of hidden debt drains across four days, with the nightly tracker
   ticking off each night as it goes. */
const M3 = {
  n: 3,
  title: 'Repaying takes days',
  line: "Paying back sleep debt takes time. In one study, recovering just 1 hour of hidden debt took about 4 days, so Somniq tracks it night by night.",
  keys: ['kitamura', 'belenky'],
  note: 'Kitamura: about 1 h of potential debt took about 4 days with 12 h nightly sleep opportunities in young men. Belenky: restricted groups remained below baseline PVT performance after 3 recovery nights.',
  cta: 'Next',
  build(mount) {
    const PTS = [60, 45, 30, 15, 0];            // minutes of debt left, Day 0 → Day 4
    const X0 = 14, X1 = 328, TOP = 20, BASE = 128;
    const xs = PTS.map((_, i) => X0 + (i * (X1 - X0)) / (PTS.length - 1));
    const ys = PTS.map((m) => BASE - (m / 60) * (BASE - TOP));
    const line = xs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
    const area = `${X0},${BASE} ` + line + ` ${X1},${BASE}`;
    const dots = xs.map((x, i) =>
      `<circle class="m3-dot" cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="5"
         fill="#0a0912" stroke="#5eead4" stroke-width="2.5" opacity="0"></circle>`).join('');
    const dayLabels = ['Today', 'Day 1', 'Day 2', 'Day 3', 'Day 4'].map((lbl, i) =>
      `<text x="${xs[i].toFixed(1)}" y="${BASE + 24}" text-anchor="${i === 0 ? 'start' : i === 4 ? 'end' : 'middle'}"
         font-size="11" fill="rgba(255,255,255,.62)">${lbl}</text>`).join('');

    mount.innerHTML = `
      <div class="hero">
        <div class="big tealgrad" id="m3-big">1 h 00 m</div>
        <div class="sub">hidden debt<br>left to repay</div>
      </div>
      <div class="card teal">
        <svg viewBox="0 0 342 160" role="img"
             aria-label="An illustrative hour of hidden sleep debt draining to zero over about four days of longer nights.">
          <defs>
            <linearGradient id="gFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#2dd4bf" stop-opacity=".34"/>
              <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient>
            <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#fda4af"/><stop offset=".5" stop-color="#fbbf24"/>
              <stop offset="1" stop-color="#5eead4"/></linearGradient>
            <clipPath id="m3-clip"><rect id="m3-rect" x="0" y="0" width="0" height="160"></rect></clipPath>
          </defs>
          <line x1="${X0}" y1="${BASE}" x2="${X1}" y2="${BASE}" stroke="rgba(255,255,255,.14)" stroke-width="1"></line>
          <text x="${X0}" y="${TOP - 6}" font-size="11" font-family="JetBrains Mono, monospace"
                fill="rgba(255,255,255,.55)">1 H DEBT</text>
          <text x="${X0}" y="${BASE - 6}" font-size="11" font-family="JetBrains Mono, monospace"
                fill="rgba(255,255,255,.56)">CLEAR</text>
          <g clip-path="url(#m3-clip)">
            <polygon points="${area}" fill="url(#gFill)"></polygon>
            <polyline points="${line}" fill="none" stroke="url(#gLine)" stroke-width="3.5"
                      stroke-linecap="round" stroke-linejoin="round"></polyline>
          </g>
          ${dots}
          ${dayLabels}
        </svg>
        <div class="nights" id="m3-nights">
          ${[1, 2, 3, 4].map((i) => `<div class="night"><div class="n">Night ${i}</div><div class="v">−15 m</div></div>`).join('')}
        </div>
        <div class="trackline"><b></b><span id="m3-track">Somniq logs each night and re-reads the balance</span></div>
        <div class="illus"><b></b>Illustrative repayment at 15 minutes a night — not a study rate or your balance</div>
      </div>
      <div class="card amber">
        <div class="eye amber">Why night by night</div>
        <p class="cap">In Belenky’s study, groups restricted to 3, 5 or 7 h in bed for 7 nights did not return to

      </div>`;

    const big = el('#m3-big', mount), rect = el('#m3-rect', mount);
    const dotEls = els('.m3-dot', mount), nightEls = els('.night', mount);
    return (t) => {
      const p = seg(t, 800, 1100);
      rect.setAttribute('width', (342 * p).toFixed(1));
      big.textContent = hm(60 * (1 - p));
      if (p >= 1 && !big.dataset.popped) { big.dataset.popped = '1'; big.classList.add('pop'); }
      dotEls.forEach((dot, i) => {
        const at = i / (PTS.length - 1);
        dot.setAttribute('opacity', p >= at - 0.02 ? '1' : '0');
      });
      nightEls.forEach((n, i) => n.classList.toggle('on', p >= (i + 1) / 4 - 0.04));

/* ═══════════════════════════ moment 4 ════════════════════════════════ */
/* Five short weeknights, then a weekend lie-in that only partly refills —
   with steady nights glowing beside it. */
const M4 = {
  n: 4,
  title: "Lie-ins aren't a full fix",
  line: "Weekend lie-ins help a little, but they don't fully undo short weeknights. Steady sleep works best.",
  keys: ['depner'],
  note: 'Depner: weekend recovery did not prevent metabolic dysregulation, including reduced insulin sensitivity when short sleep resumed. The study did not measure a sleep-debt balance.',
  cta: 'Next',
  build(mount) {
    const DAYS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const NEED = 8, H = 94, BASE = 120;
    function strip(hours, id, tones) {
      const GAP = 6, W = (342 - 6 * GAP) / 7;
      let out = '';
      hours.forEach((h, i) => {
        const x = (i * (W + GAP)).toFixed(2);
        out += `<rect class="${id}-short" x="${x}" y="${BASE}" width="${W.toFixed(2)}" height="0" rx="4"
                  fill="rgba(251,113,133,.16)"></rect>
                <rect class="${id}-bar" x="${x}" y="${BASE}" width="${W.toFixed(2)}" height="0" rx="6"
                  fill="url(#${tones[i]})"></rect>`;
      });
      const labels = DAYS.map((d, i) =>
        `<text x="${(i * (W + GAP) + W / 2).toFixed(1)}" y="${BASE + 22}" text-anchor="middle"
           font-size="11" fill="rgba(255,255,255,.62)">${d}</text>`).join('');
      return `<svg viewBox="0 0 342 152" role="img" aria-label="${id === 'a'

        <text x="342" y="${BASE - H - 8}" text-anchor="end" font-size="11"
              font-family="JetBrains Mono, monospace" fill="rgba(255,255,255,.55)">8 H NEED</text>
        ${labels}</svg>`;
    }
    const weekA = [6, 6, 6, 6, 6, 9.5, 9.5];
    const weekB = [7.8, 7.8, 7.8, 7.8, 7.8, 8, 8];
    const tonesA = ['gCoral', 'gCoral', 'gCoral', 'gCoral', 'gCoral', 'gWarm', 'gWarm'];
    const tonesB = ['gTeal2', 'gTeal2', 'gTeal2', 'gTeal2', 'gTeal2', 'gTeal2', 'gTeal2'];

    mount.innerHTML = `
      <svg width="0" height="0" aria-hidden="true" style="position:absolute">
        <defs>
          <linearGradient id="gCoral" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
          <linearGradient id="gWarm" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
          <linearGradient id="gTeal2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#10b981"/></linearGradient>
        </defs>
      </svg>
      <div class="card coral" id="m4-a">
        <div class="eye coral">Short weeknights, weekend lie-in</div>
        ${strip(weekA, 'a', tonesA)}

          <div class="tankhead"><span class="eye">After the lie-in</span>
            <span class="v" style="color:var(--amber-lit)" id="m4-av">illustrative balance</span></div>
          <div class="tanktrack part"><i id="m4-afill"></i></div>
        </div>
        <div class="illus"><b></b>Illustrative week and balance: 6 h weeknights, 8 h need; not study data</div>
      </div>
      <div class="card teal" id="m4-b">
        <div class="eye teal">Steady nights instead</div>
        ${strip(weekB, 'b', tonesB)}
        <div class="tank">
          <div class="tankhead"><span class="eye">After a steady week</span>
            <span class="v" style="color:var(--teal-lit)" id="m4-bv">illustrative balance</span></div>
          <div class="tanktrack full"><i id="m4-bfill"></i></div>
        </div>
        <div class="illus"><b></b>Illustrative week and balance: steady nights, 8 h need; not study data</div>
      </div>
      <p class="cap" id="m4-cap" style="opacity:0">These illustrative weeks total 49 h and 55 h. Depner compared 5 h sleep opportunities
        with weekend recovery against 9 h nightly opportunities; it did not test equal weekly totals.</p>`;

    const aShort = els('.a-short', mount), aBar = els('.a-bar', mount);

};

      <div class="card violet">
        <div class="eye violet">In short</div>
        <p class="reveal" style="margin-top:10px">
          <span class="w lead" data-i="0">Somniq:</span>
          <span class="w a" data-i="1">learns your need</span>
          <span class="w dot" data-i="2">•</span>
          <span class="w b" data-i="3">tracks debt nightly</span>
          <span class="w dot" data-i="4">•</span>
          <span class="w c" data-i="5">shows your energy day</span>
        </p>
        <div class="doesrows">
          <div class="doesrow"><span class="k">01</span><div><div class="t">Learns your need</div>
            <div class="d">Starts from the 7 h or more guideline, then moves with your nights.</div></div></div>
          <div class="doesrow"><span class="k">02</span><div><div class="t">Tracks debt nightly</div>
            <div class="d">Your balance is re-read every morning, from sleep time against that need.</div></div></div>
          <div class="doesrow"><span class="k">03</span><div><div class="t">Shows your energy day</div>
            <div class="d">An hour-by-hour estimate, so the good hours land where you need them.</div></div></div>
        </div>
      </div>
      <div class="card" id="m5-trust" style="opacity:0">
        <div class="eye">Before you start</div>
        <p class="trust" style="margin-top:9px">Somniq estimates your sleep debt from your sleep time and
          personal need, an approach based on sleep research (Van Dongen 2003; Kitamura 2016).
          <b>For wellness, not medical advice. Not a medical device. Talk to your doctor about sleep
          concerns.</b></p>
      </div>`;
    const words = els('.reveal .w', mount), rows = els('.doesrow', mount);
    const trust = el('#m5-trust', mount);
    return (t) => {
      words.forEach((w) => w.classList.toggle('on', t >= 420 + Number(w.dataset.i) * 230));
      rows.forEach((r, i) => r.classList.toggle('on', t >= 1500 + i * 220));
      trust.style.opacity = lin(t, 2150, 400).toFixed(2);
    };
  },
  dur: 2700,
};

const MOMENTS = [M1, M2, M3, M4, M5];

/* ═══════════════════════════ the frame ════════════════════════════════ */
const slide = el('#slide'), segsBox = el('#segs'), backBtn = el('#back');
segsBox.innerHTML = MOMENTS.map(() => '<i></i>').join('');
const segEls = els('i', segsBox);
let index = 0, raf = 0, token = 0;

function paintSegs() {
  segEls.forEach((s, i) => {
    s.className = i < index ? 'done' : i === index ? 'on' : '';
  });
  segsBox.setAttribute('aria-valuenow', String(index + 1));
  backBtn.disabled = index === 0;
}

function render(i) {
  const m = MOMENTS[i];
  index = i;
  paintSegs();
  slide.innerHTML = `
    <div class="ent">
      <h1>${m.title}</h1>
      <p class="m-line">${m.line}</p>
      <p class="m-note">${m.note}</p>
    </div>
    <div class="stage ent d1" id="stage"></div>
    <div class="ent d1" id="chipwrap"></div>
    <div class="footer ent d2">
      <button class="cta ${i === MOMENTS.length - 1 ? 'go' : ''}" id="cta">${m.cta}</button>
      <div class="eyebrow">Research · ${m.n} of ${MOMENTS.length}</div>
      ${i < MOMENTS.length - 1
        ? '<button class="skip" id="skip">Skip the research</button>'
        : '<div class="hint">Mock preview · nothing is saved</div>'}
      ${i === 0 ? '<div class="hint">Swipe or tap Next</div>' : ''}
    </div>`;
  el('#chipwrap').innerHTML = chips(m.keys);
  const paint = m.build(el('#stage'));
  el('#cta').addEventListener('click', () => go(index + 1 >= MOMENTS.length ? 0 : index + 1));
  const skip = el('#skip');
  if (skip) skip.addEventListener('click', () => go(MOMENTS.length - 1));

  cancelAnimationFrame(raf);
  const mine = ++token;
  if (REDUCED) { paint(m.dur); return; }
  const t0 = performance.now();
  const tick = (now) => {
    if (mine !== token) return;
    const t = now - t0;
    paint(Math.min(t, m.dur));
    if (t < m.dur) raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  /* belt and braces: a backgrounded or throttled tab still lands on the
     final frame, which is what ?m=N promises after ~2.5s */
  setTimeout(() => { if (mine === token) paint(m.dur); }, m.dur + 80);
}

function go(i) {
  const next = clamp(i, 0, MOMENTS.length - 1);
  const url = new URL(location.href);
  url.searchParams.set('m', String(next + 1));
  history.replaceState(null, '', url);
  render(next);
  window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
}

backBtn.addEventListener('click', () => go(index - 1));

/* swipe + keyboard */
let sx = 0, sy = 0, tracking = false;
slide.addEventListener('touchstart', (ev) => {
  const p = ev.touches[0]; sx = p.clientX; sy = p.clientY; tracking = true;
}, { passive: true });
slide.addEventListener('touchend', (ev) => {
  if (!tracking) return;
  tracking = false;
  const p = ev.changedTouches[0];
  const dx = p.clientX - sx, dy = p.clientY - sy;
  if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
  if (ev.target.closest('a,button')) return;
  go(index + (dx < 0 ? 1 : -1));
}, { passive: true });
window.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowRight') go(index + 1);
  if (ev.key === 'ArrowLeft') go(index - 1);
});

/* ?m=1..5 opens a moment directly; it is settled by ~2.5s either way */
const want = Number(new URLSearchParams(location.search).get('m') || 1);
render(Number.isFinite(want) ? clamp(Math.round(want) - 1, 0, MOMENTS.length - 1) : 0);
document.documentElement.dataset.ready = '1';
</script>
</body>
</html>
